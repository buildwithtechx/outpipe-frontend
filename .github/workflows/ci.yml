name: Frontend CI

on:
  push:
    branches: [main, dev, canary]
  pull_request:
    branches: [main, dev, canary]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format
      - run: npm run typecheck
      - run: npm run typecheck --workspace apps/secrets-share
      - run: npm run typecheck --workspace apps/status
      - run: npm run build:web
      - run: npm run build:secrets-share
      - run: npm run build:status
      - run: npm run test
      - run: npm run test:product-contracts
