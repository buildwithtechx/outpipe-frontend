name: Deploy Frontends to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: "Application to deploy"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - web
          - status
          - secrets-share
          - docs

concurrency:
  group: deploy-cloudflare-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Deploy Dashboard & Landing (web)
        if: github.event_name == 'push' || inputs.target == 'all' || inputs.target == 'web'
        run: npm run deploy:web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Status Page (status)
        if: github.event_name == 'push' || inputs.target == 'all' || inputs.target == 'status'
        run: npm run deploy:status
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Secrets Share (secrets-share)
        if: github.event_name == 'push' || inputs.target == 'all' || inputs.target == 'secrets-share'
        run: npm run deploy:secrets-share
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Documentation (docs)
        if: github.event_name == 'push' || inputs.target == 'all' || inputs.target == 'docs'
        run: npm run deploy:docs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
