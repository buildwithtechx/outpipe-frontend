name: Dependency Audit

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "30 3 * * 1"

permissions:
  contents: read

jobs:
  npm:
    name: npm vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
